<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dealer Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fa;
  color:#101828;
  font-family:Arial,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:20px;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

h1{
  margin:0;
  font-size:22px;
}

.subtitle{
  margin-top:5px;
  color:#98a2b3;
}

.logout{
  border:0;
  background:white;
  color:#111827;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:900px;
  margin:25px auto;
}

.card{
  background:white;
  border:1px solid #e4e7ec;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-size:14px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:100px;
}

.save{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.save:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
}

.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
}

.car{
  padding:18px 0;
  border-bottom:1px solid #eaecf0;
}

.car:last-child{
  border-bottom:0;
}

.car img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:12px;
}

.car h3{
  margin-bottom:5px;
}

.car p{
  margin:6px 0;
  color:#667085;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.action-btn{
  flex:1;
  padding:12px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  font-size:14px;
}

.sold-btn{
  background:#ecfdf3;
  color:#027a48;
}

.delete-btn{
  background:#fef3f2;
  color:#b42318;
}

.empty{
  text-align:center;
  padding:25px;
  color:#667085;
}

@media(max-width:600px){

  .header{
    align-items:flex-start;
  }

  .actions{
    flex-direction:column;
  }

}
</style>
</head>

<body>


<header>

<div class="header">

<div>
<h1>🚗 Dealer Dashboard</h1>

<div class="subtitle">
Manage your car inventory
</div>
</div>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">


<!-- ADD CAR -->

<div class="card">

<h2>Add New Car</h2>


<label>Car Name</label>

<input
id="name"
placeholder="Mahindra Scorpio N"
>


<label>Price</label>

<input
id="price"
type="number"
placeholder="1550000"
>


<label>Year</label>

<input
id="year"
type="number"
placeholder="2024"
>


<label>Kilometres</label>

<input
id="km"
type="number"
placeholder="18000"
>


<label>Fuel</label>

<select id="fuel">

<option value="">
Select fuel
</option>

<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
<option>Electric</option>
<option>Hybrid</option>

</select>


<label>Transmission</label>

<select id="transmission">

<option value="">
Select transmission
</option>

<option>Manual</option>
<option>Automatic</option>

</select>


<label>Description</label>

<textarea
id="description"
placeholder="Write car details">
</textarea>


<label>Car Image</label>

<input
id="image"
type="file"
accept="image/*"
>


<label>Status</label>

<select id="status">

<option>Available</option>
<option>Sold</option>
<option>Reserved</option>

</select>


<button
class="save"
id="saveButton"
onclick="saveCar()">

Publish Car

</button>


<div
id="message"
class="message">
</div>

</div>


<!-- INVENTORY -->

<div class="card">

<h2>My Inventory</h2>

<div id="inventory">

Loading cars...

</div>

</div>


</div>
