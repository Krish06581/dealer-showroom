<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealer Dashboard</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f7fa;
font-family:Arial,sans-serif;
color:#101828
}

header{
background:#111827;
color:white;
padding:20px;
}

.header-row{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

header h1{
margin:0;
font-size:23px;
}

header p{
margin:5px 0 0;
color:#98a2b3;
}

.logout{
background:white;
color:#111827;
border:0;
padding:10px 14px;
border-radius:9px;
font-weight:700;
}

.container{
max-width:900px;
width:92%;
margin:25px auto;
}

.panel{
background:white;
border:1px solid #e4e7ec;
border-radius:18px;
padding:22px;
margin-bottom:22px;
}

h2{
margin-top:0;
}

label{
display:block;
font-weight:700;
font-size:14px;
margin:15px 0 6px;
}

input,
select,
textarea{
width:100%;
padding:13px;
border:1px solid #d0d5dd;
border-radius:10px;
font-size:15px;
}

textarea{
min-height:100px;
}

.primary{
width:100%;
margin-top:20px;
background:#111827;
color:white;
border:0;
padding:15px;
border-radius:10px;
font-size:16px;
font-weight:800;
}

.primary:disabled{
opacity:.6;
}

.message{
display:none;
margin-top:15px;
padding:13px;
border-radius:10px;
font-weight:600;
}

.success{
background:#ecfdf3;
color:#027a48;
}

.error{
background:#fef3f2;
color:#b42318;
}

.car{
border-bottom:1px solid #eaecf0;
padding:18px 0;
}

.car:last-child{
border-bottom:0;
}

.car img{
width:100%;
height:190px;
object-fit:cover;
border-radius:12px;
}

.car h3{
margin:12px 0 5px;
}

.car p{
margin:5px 0;
color:#667085;
}

.actions{
display:flex;
gap:8px;
margin-top:12px;
}

.actions button{
border:0;
padding:11px 14px;
border-radius:9px;
font-weight:700;
}

.edit{
background:#eef4ff;
color:#175cd3;
}

.sold{
background:#ecfdf3;
color:#027a48;
}

.delete{
background:#fef3f2;
color:#b42318;
}

.preview{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:12px;
margin-top:10px;
display:none;
}

.empty{
text-align:center;
padding:30px;
color:#667085;
}

@media(max-width:600px){

.header-row{
align-items:flex-start;
}

header h1{
font-size:20px;
}

.actions{
flex-wrap:wrap;
}

.actions button{
flex:1;
}

}
</style>
</head>

<body>

<header>

<div class="header-row">

<div>
<h1>🚗 Dealer Dashboard</h1>
<p>Manage your live car inventory</p>
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">


<!-- ADD / EDIT -->

<div class="panel">

<h2 id="formTitle">Add New Car</h2>

<label>Car Name</label>
<input id="name" placeholder="Mahindra Scorpio N">

<label>Price</label>
<input id="price" type="number" placeholder="1550000">

<label>Year</label>
<input id="year" type="number" placeholder="2024">

<label>Kilometres</label>
<input id="km" type="number" placeholder="18000">

<label>Fuel</label>

<select id="fuel">
<option value="">Select fuel</option>
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
<option>Electric</option>
<option>Hybrid</option>
</select>

<label>Transmission</label>

<select id="transmission">
<option value="">Select transmission</option>
<option>Manual</option>
<option>Automatic</option>
</select>

<label>Description</label>

<textarea
id="description"
placeholder="Write car details"></textarea>

<label>Car Photo</label>

<input
id="image"
type="file"
accept="image/*">

<img id="preview" class="preview">

<label>Status</label>

<select id="carStatus">
<option>Available</option>
<option>Sold</option>
<option>Reserved</option>
</select>

<button
class="primary"
id="saveButton">
Publish Car
</button>

<div id="message" class="message"></div>

</div>


<!-- INVENTORY -->

<div class="panel">

<h2>My Inventory</h2>

<div id="inventory">
Loading cars...
</div>

</div>

</div>


<script>

/* ================================
   LOGIN PROTECTION
================================ */

if(
localStorage.getItem("dealer_logged_in") !== "true"
){
window.location.href="login.html";
}


/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://lpdalirembwxxeurwhhh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lUBNsX4r6muXgVBqDDp-Vg_VSVIJnWA";


const inventory =
document.getElementById("inventory");

const message =
document.getElementById("message");

const saveButton =
document.getElementById("saveButton");

const imageInput =
document.getElementById("image");

const preview =
document.getElementById("preview");

let cars=[];
let editingName=null;


/* ================================
   LOGOUT
================================ */

function logout(){

localStorage.removeItem("dealer_logged_in");
localStorage.removeItem("dealer_access_token");
localStorage.removeItem("dealer_refresh_token");

window.location.href="login.html";

}


/* ================================
   MESSAGE
================================ */

function showMessage(text,type){

message.textContent=text;
message.className="message "+type;
message.style.display="block";

}


/* ================================
   IMAGE PREVIEW
================================ */

imageInput.addEventListener(
"change",
function(){

const file=imageInput.files[0];

if(!file){

preview.style.display="none";
return;

}

preview.src=URL.createObjectURL(file);
preview.style.display="block";

}
);


/* ================================
   LOAD CARS
================================ */

async function loadCars(){

inventory.innerHTML=
"<div class='empty'>Loading cars...</div>";

try{

const response=await fetch(

SUPABASE_URL+
"/rest/v1/Cars?select=*",

{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Accept":"application/json"
}

}
);


if(!response.ok){

throw new Error(
await response.text()
);

}


cars=await response.json();

renderCars();


}catch(error){

console.error(error);

inventory.innerHTML=
"<div class='empty'>" +
"<b>Could not load cars.</b>" +
"<br><br>" +
error.message +
"</div>";

}

}


/* ================================
   RENDER
================================ */

function renderCars(){

if(cars.length===0){

inventory.innerHTML=
"<div class='empty'>No cars in inventory.</div>";

return;

}


inventory.innerHTML=cars.map(
function(car){

const safeName=
encodeURIComponent(car.Name || "");
