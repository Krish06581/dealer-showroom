<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealer Dashboard</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
color:#101828
}

header{
background:#111827;
color:white;
padding:22px 5%
}

header h1{margin:0}
header p{color:#98a2b3;margin:6px 0 0}

.container{
width:92%;
max-width:1100px;
margin:25px auto
}

.panel{
background:white;
border:1px solid #e4e7ec;
border-radius:18px;
padding:22px;
margin-bottom:25px
}

label{
display:block;
font-weight:700;
font-size:14px;
margin:15px 0 6px
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:10px;
font-size:15px
}

textarea{min-height:100px}

button{
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:700;
cursor:pointer
}

.primary{
background:#111827;
color:white;
width:100%;
margin-top:20px;
padding:14px
}

.car{
display:flex;
gap:18px;
padding:15px 0;
border-bottom:1px solid #eaecf0;
align-items:center
}

.car:last-child{border-bottom:0}

.car img{
width:130px;
height:90px;
object-fit:cover;
border-radius:12px;
background:#eee
}

.car-info{
flex:1
}

.car-info h3{
margin:0 0 6px
}

.car-info p{
margin:4px 0;
color:#667085;
font-size:14px
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.edit{
background:#eef4ff;
color:#175cd3
}

.sold{
background:#ecfdf3;
color:#027a48
}

.delete{
background:#fef3f2;
color:#b42318
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:9px;
font-weight:600
}

.success{
background:#ecfdf3;
color:#027a48
}

.error{
background:#fef3f2;
color:#b42318
}

.preview{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:12px;
margin-top:10px;
display:none
}

@media(max-width:700px){

.car{
align-items:flex-start;
flex-direction:column
}

.car img{
width:100%;
height:190px
}

.actions{
width:100%
}

.actions button{
flex:1
}
}
</style>
</head>

<body>

<header>
<h1>🚗 Dealer Dashboard</h1>
<p>Manage your live car inventory</p>
</header>

<div class="container">

<!-- ADD / EDIT -->

<div class="panel">

<h2 id="formTitle">Add New Car</h2>

<label>Car Name</label>
<input id="name" placeholder="Mahindra Scorpio N">

<label>Price</label>
<input id="price" type="number" placeholder="1550000">

<label>Year</label>
<input id="year" type="number" placeholder="2024">

<label>Kilometres</label>
<input id="km" type="number" placeholder="18000">

<label>Fuel</label>
<select id="fuel">
<option value="">Select fuel</option>
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
<option>Electric</option>
<option>Hybrid</option>
</select>

<label>Transmission</label>
<select id="transmission">
<option value="">Select transmission</option>
<option>Manual</option>
<option>Automatic</option>
</select>

<label>Description</label>
<textarea id="description"
placeholder="Write car details..."></textarea>

<label>Car Photo</label>
<input id="image" type="file" accept="image/*">

<img id="preview" class="preview">

<label>Status</label>
<select id="status">
<option>Available</option>
<option>Sold</option>
<option>Reserved</option>
</select>

<button class="primary" id="saveButton">
Publish Car
</button>

<div id="message" class="message"></div>

</div>


<!-- INVENTORY -->

<div class="panel">

<h2>My Inventory</h2>

<div id="inventory">
Loading cars...
</div>

</div>

</div>
