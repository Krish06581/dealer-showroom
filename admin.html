<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dealer Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#101828;
}

header{
  background:#111827;
  color:white;
  padding:20px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#98a2b3;
}

.container{
  width:92%;
  max-width:900px;
  margin:30px auto;
}

.form{
  background:white;
  border:1px solid #e4e7ec;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:18px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#111827;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.preview{
  width:100%;
  max-height:280px;
  object-fit:cover;
  border-radius:14px;
  margin-top:12px;
  display:none;
}

.message{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  display:none;
  font-weight:600;
}

.success{
  background:#ecfdf3;
  color:#027a48;
}

.error{
  background:#fef3f2;
  color:#b42318;
}

.note{
  background:#f2f4f7;
  padding:13px;
  border-radius:10px;
  margin-top:18px;
  font-size:13px;
  color:#667085;
}

.back{
  display:inline-block;
  margin-top:20px;
  text-decoration:none;
  color:#344054;
  font-weight:700;
}
</style>
</head>

<body>

<header>
  <h1>Dealer Dashboard</h1>
  <p>Add a new car to your live showroom</p>
</header>

<div class="container">

<div class="form">

<h2>🚗 Add New Car</h2>

<label>Car Name</label>
<input id="name" placeholder="Example: Mahindra Scorpio N">

<label>Price</label>
<input id="price" type="number" placeholder="Example: 1550000">

<label>Year</label>
<input id="year" type="number" placeholder="Example: 2024">

<label>Kilometres</label>
<input id="km" type="number" placeholder="Example: 18000">

<label>Fuel</label>
<select id="fuel">
  <option value="">Select fuel</option>
  <option>Petrol</option>
  <option>Diesel</option>
  <option>CNG</option>
  <option>Electric</option>
  <option>Hybrid</option>
</select>

<label>Transmission</label>
<select id="transmission">
  <option value="">Select transmission</option>
  <option>Manual</option>
  <option>Automatic</option>
</select>

<label>Description</label>
<textarea id="description"
placeholder="Write something about the car..."></textarea>

<label>Car Photo</label>
<input id="image" type="file" accept="image/*">

<img id="preview" class="preview">

<label>Status</label>
<select id="status">
  <option>Available</option>
  <option>Sold</option>
  <option>Reserved</option>
</select>

<button id="publish">
  Publish Car
</button>

<div id="message" class="message"></div>

<div class="note">
  After publishing, the car will be added to your Cars database and can appear on the live showroom.
</div>

</div>

<a class="back" href="index.html">
← Back to showroom
</a>

</div>


<script>

/* ==========================
   SUPABASE
   ========================== */

const SUPABASE_URL =
"https://lpdalirembwxxeurwhhh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lUBNsX4r6muXgVBqDDp-Vg_VSVIJnWA";


/* ==========================
   ELEMENTS
   ========================== */

const imageInput =
document.getElementById("image");

const preview =
document.getElementById("preview");

const publish =
document.getElementById("publish");

const message =
document.getElementById("message");


/* ==========================
   IMAGE PREVIEW
   ========================== */

imageInput.addEventListener("change",function(){

const file = this.files[0];

if(!file){
  preview.style.display="none";
  return;
}

preview.src =
URL.createObjectURL(file);

preview.style.display="block";

});


/* ==========================
   MESSAGE
   ========================== */

function showMessage(text,type){

message.textContent=text;

message.className =
"message " + type;

message.style.display="block";

}


/* ==========================
   PUBLISH CAR
   ========================== */

publish.addEventListener("click",async function(){

try{

publish.disabled=true;

showMessage(
"Uploading car...",
"success"
);


/* GET FORM DATA */

const name =
document.getElementById("name").value.trim();

const price =
document.getElementById("price").value;

const year =
document.getElementById("year").value;

const km =
document.getElementById("km").value;

const fuel =
document.getElementById("fuel").value;

const transmission =
document.getElementById("transmission").value;

const description =
document.getElementById("description").value.trim();

const status =
document.getElementById("status").value;

const file =
imageInput.files[0];


/* VALIDATION */

if(!name || !price || !year || !km || !fuel || !transmission || !file){

throw new Error(
"Please fill all required fields and choose a photo."
);

}


/* ==========================
   UPLOAD IMAGE
   ========================== */

const fileName =
Date.now() + "-" +
file.name.replace(/[^a-zA-Z0-9.-]/g,"-");


const uploadUrl =
SUPABASE_URL +
"/storage/v1/object/Car%20images/" +
encodeURIComponent(fileName);


const uploadResponse =
await fetch(uploadUrl,{

method:"POST",

headers:{
"Authorization":
"Bearer " + SUPABASE_KEY,

"apikey":
SUPABASE_KEY,

"Content-Type":
file.type
},

body:file

});


if(!uploadResponse.ok){

const error =
await uploadResponse.text();

throw new Error(
"Image upload failed: " + error
);

}


/* ==========================
   IMAGE URL
   ========================== */

const imageUrl =
SUPABASE_URL +
"/storage/v1/object/public/Car%20images/" +
encodeURIComponent(fileName);


/* ==========================
   SAVE CAR
   ========================== */

const carResponse =
await fetch(
SUPABASE_URL +
"/rest/v1/Cars",
{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

Name:name,

Price:Number(price),

Year:Number(year),

Km:Number(km),

Fuel:fuel,

Transmission:transmission,

Description:description,

Image_url:imageUrl,

Status:status

})

});


if(!carResponse.ok){

const error =
await carResponse.text();

throw new Error(
"Car save failed: " + error
);

}


/* ==========================
   SUCCESS
   ========================== */

showMessage(
"🎉 Car published successfully!",
"success"
);


/* CLEAR FORM */

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("year").value="";
document.getElementById("km").value="";
document.getElementById("fuel").value="";
document.getElementById("transmission").value="";
document.getElementById("description").value="";
document.getElementById("status").value="Available";

imageInput.value="";
preview.style.display="none";


}catch(error){

console.error(error);

showMessage(
error.message,
"error"
);

}finally{

publish.disabled=false;

}

});

</script>

</body>
</html>
